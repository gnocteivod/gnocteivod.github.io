<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Productivity High-End</title>
    <style>
        :root {
            --bg: #030712;
            --primary: #00f2ff;
            --secondary: #7000ff;
            --success: #39ff14;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: 'Orbitron', sans-serif; /* Bạn có thể thay bằng 'Inter' nếu muốn thanh lịch */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* Container 9:16 nghệ thuật hơn */
        .phone-frame {
            width: 360px;
            height: 640px;
            background: radial-gradient(circle at 50% 0%, #1a1a3a 0%, #030712 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1);
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Hạt trôi lơ lửng phía sau */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            background-image: radial-gradient(circle, var(--primary) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            animation: moveBg 20s linear infinite;
            z-index: 0;
        }

        @keyframes moveBg {
            from { background-position: 0 0; }
            to { background-position: 100px 100px; }
        }

        /* Tiêu đề với hiệu ứng Neon Pulse */
        h1 {
            z-index: 2;
            font-size: 26px;
            text-align: center;
            margin: 0 0 40px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.6));
        }

        /* Biểu đồ có hiệu ứng phát sáng mờ */
        .chart-box {
            z-index: 2;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .line {
            fill: none;
            stroke: var(--primary);
            stroke-width: 4;
            stroke-linecap: round;
            filter: drop-shadow(0 0 12px var(--primary));
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Chỉ số tăng trưởng cực đẹp */
        .productivity-stat {
            z-index: 2;
            text-align: center;
            margin-bottom: 40px;
        }

        .number {
            font-size: 60px;
            font-weight: 800;
            color: var(--success);
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            display: block;
        }

        .label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        /* Cửa sổ Code phong cách Hacker hiện đại */
        .automation-window {
            z-index: 2;
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.6);
            border-top: 2px solid var(--secondary);
            border-radius: 10px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            box-shadow: inset 0 0 20px rgba(112, 0, 255, 0.1);
        }

        .code-line {
            margin-bottom: 8px;
            display: block;
            border-right: 3px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
        }

        /* Animation cho từng dòng code chạy lần lượt */
        .line1 { animation: type 1s steps(30) forwards; animation-delay: 0.5s; }
        .line2 { animation: type 1s steps(30) forwards; animation-delay: 1.5s; }
        .line3 { animation: type 1s steps(30) forwards; animation-delay: 2.5s; }
        .line4 { animation: type 1s steps(30) forwards; animation-delay: 3.5s; }
        .line5 { animation: type 1s steps(30) forwards; animation-delay: 4.5s; }

        @keyframes type {
            from { width: 0; }
            to { width: 100%; border-color: transparent; }
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        /* Vầng sáng phía sau */
        .bloom {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--secondary);
            filter: blur(100px);
            opacity: 0.2;
            bottom: 10%;
            right: -50px;
            z-index: 1;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="phone-frame">
        <div class="particles"></div>
        <div class="bloom"></div>
        
        <h1>CHỈ SỐ TĂNG TRƯỞNG</h1>

        <div class="chart-box">
            <svg viewBox="0 0 320 150">
                <line x1="0" y1="120" x2="320" y2="120" stroke="rgba(255,255,255,0.1)" />
                <line x1="0" y1="80" x2="320" y2="80" stroke="rgba(255,255,255,0.1)" />
                <line x1="0" y1="40" x2="320" y2="40" stroke="rgba(255,255,255,0.1)" />
                
                <path class="line" d="M10,140 C50,135 80,100 120,90 S200,40 310,10" />
            </svg>
        </div>

        <div class="productivity-stat">
            <span class="number">+65%</span>
            <span class="label">Productivity Boost</span>
        </div>

        <div class="automation-window">
            <span class="code-line line1" style="color: var(--primary);">[SYSTEM]: Initializing AI...</span>
            <span class="code-line line2" style="color: #ecc94b;">[AUTH]: Access Granted</span>
            <span class="code-line line3" style="color: var(--success);">[EXEC]: Automating workflows...</span>
            <span class="code-line line4" style="color: white;">> 1,420 tasks optimized</span>
            <span class="code-line line5" style="color: var(--primary);">[STATUS]: Peak Efficiency</span>
        </div>
    </div>

</body>
</html>
