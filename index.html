<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysium - Nền tảng sự kiện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans">

    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <a href="index.html" class="text-3xl font-black tracking-tighter bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                Elysium
            </a>

            <nav class="hidden md:flex space-x-8 font-bold text-gray-600">
                <a href="#" class="hover:text-pink-500 transition">Sự kiện</a>
                <a href="#" class="hover:text-pink-500 transition">Lịch</a>
                <a href="#" class="hover:text-pink-500 transition">Về chúng tôi</a>
            </nav>

            <div class="flex items-center gap-4">
                <a href="#" class="text-sm font-bold text-gray-500 hover:text-pink-500">Đăng nhập</a>
                <a href="#" class="bg-black text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-gray-800 transition">
                    Tham gia ngay
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <section class="text-center py-20 bg-white rounded-3xl border border-gray-100 shadow-sm mb-12">
            <h1 class="text-5xl md:text-7xl font-black text-gray-900 mb-6 uppercase italic">
                Sự kiện <span class="text-pink-500">Đẳng cấp</span>
            </h1>
            <p class="text-xl text-gray-500 max-w-2xl mx-auto mb-10 font-medium">
                Nền tảng quản lý vé sự kiện ứng dụng công nghệ hiện đại, minh bạch và bảo mật.
            </p>
            <div class="flex justify-center gap-4">
                <button class="bg-pink-500 text-white px-10 py-4 rounded-2xl font-black shadow-lg shadow-pink-200 hover:scale-105 transition">KHÁM PHÁ NGAY</button>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="h-64 bg-gray-200 rounded-2xl animate-pulse"></div>
            <div class="h-64 bg-gray-200 rounded-2xl animate-pulse"></div>
            <div class="h-64 bg-gray-200 rounded-2xl animate-pulse"></div>
            <div class="h-64 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-400 font-bold">Cuộn chuột xuống để thấy Header biến mất</div>
            <div class="h-64 bg-gray-100 rounded-2xl"></div>
            <div class="h-64 bg-gray-100 rounded-2xl"></div>
        </section>
    </main>

    <footer class="bg-white border-t border-gray-100 py-10 text-center">
        <p class="text-gray-400 font-bold text-sm">© 2026 ELYSIUM - DIGITAL BUSINESS PROJECT</p>
    </footer>

</body>
</html>
